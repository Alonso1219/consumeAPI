<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 04 - Buscar Fotografías</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .search-box {
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            max-width: 500px;
        }
        .foto-card {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            max-width: 600px;
        }
        .foto-card img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            margin-right: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cuadro de búsqueda -->
        <div class="search-box">
            <h5 class="mb-3">Buscar fotografías</h5>
            <div class="d-flex align-items-end">
                <div class="flex-grow-1 me-2">
                    <label for="inputAlbumId" class="form-label mb-1">Album ID</label>
                    <input type="number" class="form-control" id="inputAlbumId" value="1">
                </div>
                <button class="btn btn-dark" id="btnBuscar">Buscar</button>
            </div>
        </div>

        <!-- Contenedor de resultados -->
        <div id="contenedorResultados">
            <!-- Aquí se inyectarán las fotos -->
        </div>
    </div>

    <!-- Enlace al JS -->
    <script src="../JS/prac4.js"></script>
</body>
</html>
